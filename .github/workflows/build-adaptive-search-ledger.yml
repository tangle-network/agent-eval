          source = source.replace(
            `  type SearchLedgerAppendResult,\n`,
            `  type SearchLedgerAppendResult,\n  type SearchLedgerArtifactRefOptions,\n`,
          )
          source = source.replace(
            `  type SearchTaskAttemptedEvent,\n`,
            `  type SearchTaskAttemptedEvent,\n  type SearchTaskClosedEvent,\n  type SearchTaskExecutionIdentity,\n`,
          )
          source = source.replace(
            `  validateSearchLedgerEvent,\n`,
            `  projectSearchLedgerEntries,\n  searchLedgerArtifactRef,\n  validateSearchLedgerEvent,\n`,
          )
          fs.writeFileSync(path, source)

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          const marker = '## [Unreleased]\n\n'
          if (!changelog.includes(marker)) throw new Error('Unreleased changelog marker not found')
          if (!changelog.includes('adaptive optimizer search histories')) {
            changelog = changelog.replace(
              marker,
              `${marker}### Added\n\n- Make the canonical SearchLedger usable by adaptive optimizers: candidate registration may occur while generation is in flight; planned candidate/task cells may be explicitly closed without inventing a score; task execution may identify an opaque dispatch instead of a fake model; filesystem and CampaignStorage ledgers expose exact content-addressed artifact references.\n\n`,
            )
          }
          fs.writeFileSync(changelogPath, changelog)

          const docPath = 'docs/search-history-receipts.md'
          let doc = fs.readFileSync(docPath, 'utf8')
          const ownership = '\n## Ownership\n'
          if (!doc.includes(ownership)) throw new Error('search history docs ownership anchor not found')
          const adaptive = `
          ## Adaptive optimizers

          A fixed denominator does not require an optimizer to evaluate every candidate on every case. It requires every planned cell to end honestly:

          - `task-attempted` records a measured or errored execution;
          - `task-closed` records that an adaptive policy deliberately did not request the cell, or stopped retrying it, without converting absence into a score;
          - candidate slots that were never produced close explicitly;
          - the generation operation may remain in flight while candidates are registered, but terminal completion verifies the operation outcome against every slot.

          `SearchTaskExecutionIdentity` accepts either an immutable model/agent identity or an immutable dispatch reference. A multi-step Runtime dispatch must not be mislabeled as one model call.

          `openCampaignSearchLedger()` uses the filesystem ledger with trusted-head pinning for `fsCampaignStorage()`. Memory and custom stores retain the same canonical event validation and state-machine projection through compare-and-append storage, but report trusted-head pinning as unsupported. In every case, `ledger.artifactRef()` binds the exact JSONL bytes used by `SearchHistoryReceipt`.
          `
          doc = doc.replace(ownership, `${adaptive}${ownership}`)
          fs.writeFileSync(docPath, doc)
