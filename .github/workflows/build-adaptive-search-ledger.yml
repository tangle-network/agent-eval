      - name: Repin benchmark implementation digest if the governed source set changed
        run: |
          DIGESTS=$(node scripts/check-analyst-benchmark-implementation.mjs --print-only)
          SOURCE_DIGEST=$(printf '%s\n' "$DIGESTS" | head -n 1)
          LOCK_DIGEST=$(printf '%s\n' "$DIGESTS" | tail -n 1)
          node - "$SOURCE_DIGEST" "$LOCK_DIGEST" <<'NODE'
          const fs = require('node:fs')
          const [sourceDigest, lockDigest] = process.argv.slice(2)
          const path = 'src/analyst/benchmark-implementation.ts'
          let value = fs.readFileSync(path, 'utf8')
          value = value.replace(
            /(ANALYST_BENCHMARK_IMPLEMENTATION_SHA256\s*=\s*\n\s*')[0-9a-f]{64}(')/,
            `$1${sourceDigest}$2`,
          )
          value = value.replace(
            /(ANALYST_BENCHMARK_DEPENDENCY_LOCK_SHA256\s*=\s*\n\s*')[0-9a-f]{64}(')/,
            `$1${lockDigest}$2`,
          )
          fs.writeFileSync(path, value)
          NODE
          pnpm biome check --write src/analyst/benchmark-implementation.ts

