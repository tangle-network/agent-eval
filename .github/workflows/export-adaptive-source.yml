name: Export adaptive branch source

on:
  push:
    branches: [feat/adaptive-search-ledger-v1]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/adaptive-search-ledger-v1
      - name: Pack repository source
        run: tar --exclude=.git -czf /tmp/agent-eval-adaptive-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-eval-adaptive-source
          path: /tmp/agent-eval-adaptive-source.tar.gz
          if-no-files-found: error
          retention-days: 1
