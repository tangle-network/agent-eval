# Adopt each new @tangle-network release in the calling repository: pin it,
# widen the caller's own peer ranges to include it, gate the result with the
# caller's acceptance command and open one pull request on chore/adopt-stack,
# merged when `merge` is true and the gate passed. scripts/adopt-stack.mjs owns
# the steps and their rules.
#
# A caller schedules it, because a reusable workflow cannot schedule itself:
#
#   on:
#     schedule: [{ cron: '*/30 * * * *' }]
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     adopt:
#       uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@main
#       with:
#         gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
#         post-pin: pnpm sync:pins
#         runs-on: '["self-hosted", "beelink"]'
#         default-branch: master
#         merge: true
#       secrets: inherit
#
# Each caller runs scripts/adopt-stack.mjs from agent-eval `stack-ref` (default
# main) with a write-scoped token; pin `uses:` and `stack-ref` to a sha to take
# script changes only on purpose.
#
# A merge made with the default workflow token starts no push workflow in the
# caller. Pass a `token` secret (a PAT or app token) when the merge must trigger
# push deploys, or set deploy-workflow to an existing workflow_dispatch workflow
# and grant the caller actions: write. Dispatch follows confirmed merge only;
# that workflow still owns its preflight and served revision proof.
name: Adopt stack

on:
  workflow_call:
    inputs:
      packages:
        description: '@tangle-network/* names to adopt, comma or space separated (default: all declared workspace manifests)'
        type: string
        default: ''
      gate:
        description: "The caller's acceptance command, run from its checkout after the install"
        type: string
        default: ''
      post-pin:
        description: "The caller's own sync step, run from its checkout after the pins and install and before the gate; the files it changes join the adoption commit"
        type: string
        default: ''
      deploy-workflow:
        description: 'Existing caller workflow to dispatch on the default branch after confirmed merge; caller must grant actions: write'
        type: string
        default: ''
      runs-on:
        description: 'A runner label or JSON array; internal public adoption always uses the trusted production group'
        type: string
        default: ''
      default-branch:
        description: 'The branch adoption PRs target'
        type: string
        default: main
      merge:
        description: 'Merge the adoption PR when the gate passes'
        type: boolean
        default: false
      dry-run:
        description: 'Print the plan and change nothing'
        type: boolean
        default: false
      stack-ref:
        description: 'The agent-eval revision whose scripts/adopt-stack.mjs runs'
        type: string
        default: main
    secrets:
      token:
        required: false

jobs:
  adopt:
    # A reviewed default-branch caller owns its gate/post-pin commands and target.
    # Public PR runners retain workspace state and must never receive write tokens.
    # External callers keep their hosted default and explicit runner selection.
    if: ${{ github.repository_owner != 'tangle-network' || github.event.repository.private || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.event_name, 'pull_request')) }}
    runs-on: ${{ (github.repository_owner == 'tangle-network' && !github.event.repository.private && fromJSON('{"group":"public-app-production","labels":["self-hosted","ci-deploy"]}')) || (inputs.runs-on != '' && (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on)) || (github.repository_owner != 'tangle-network' && 'ubuntu-latest') || fromJSON('["self-hosted","beelink"]') }}
    timeout-minutes: 75
    # One adoption at a time per repository, so two runs never race one branch.
    concurrency:
      group: adopt-stack-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          path: caller
          token: ${{ secrets.token || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: tangle-network/agent-eval
          ref: ${{ inputs.stack-ref }}
          path: adopt-stack
          sparse-checkout: |
            scripts/adopt-stack.mjs
            scripts/adopt-stack-workspace.mjs
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v6
        if: ${{ hashFiles('caller/pnpm-lock.yaml', 'caller/pnpm-workspace.yaml') != '' }}
        with:
          package_json_file: caller/package.json

      - uses: actions/setup-node@v7
        with:
          # The caller owns its runtime pin; unpinned callers keep the default.
          node-version: ${{ hashFiles('caller/.nvmrc') == '' && '22' || '' }}
          node-version-file: ${{ hashFiles('caller/.nvmrc') != '' && 'caller/.nvmrc' || '' }}

      - name: Adopt the newest @tangle-network releases
        id: adoption
        working-directory: caller
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          PACKAGES: ${{ inputs.packages }}
          GATE: ${{ inputs.gate }}
          POST_PIN: ${{ inputs.post-pin }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          MERGE: ${{ inputs.merge && '--merge' || '' }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          args=(--packages "$PACKAGES" --gate "$GATE" --post-pin "$POST_PIN" --deploy-workflow "$DEPLOY_WORKFLOW" --default-branch "$DEFAULT_BRANCH")
          if [[ -n "$MERGE" ]]; then args+=("$MERGE"); fi
          if [[ -n "$DRY_RUN" ]]; then args+=("$DRY_RUN"); fi
          node ../adopt-stack/scripts/adopt-stack.mjs "${args[@]}"

      # The caller's test command owns these diagnostic files. Keep the exact
      # generated cohort and every local browser attempt before runner cleanup.
      # Raw traces may contain local test-session data, so retain them only in
      # private caller repositories; never upload env files or auth/cache trees.
      - name: Retain private failed adoption evidence
        if: ${{ failure() && steps.adoption.outcome == 'failure' && github.event.repository.private }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: adopt-stack-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            caller/package.json
            caller/pnpm-lock.yaml
            caller/package-lock.json
            caller/pnpm-workspace.yaml
            caller/.artifacts/gate/worker.log
            caller/.artifacts/gate/browser-attempts
            caller/.artifacts/gate/browser-attempt-*.log
            caller/.artifacts/gate/browser-tests.log
            caller/.artifacts/browser-*/attempt-*/**/trace.zip
            caller/.artifacts/browser-*/attempt-*/**/error-context.md
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 9
          retention-days: 1
