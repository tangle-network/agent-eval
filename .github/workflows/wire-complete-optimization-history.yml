name: Wire complete optimization history

on:
  push:
    branches: [feat/complete-optimization-history-v1]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/complete-optimization-history-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make history additive to the existing comparison contract
        run: |
          node <<'EOF'
          const fs = require('node:fs')

          function replaceOnce(source, needle, replacement, label) {
            const first = source.indexOf(needle)
            if (first < 0) throw new Error(`${label}: anchor not found`)
            if (source.indexOf(needle, first + needle.length) >= 0) {
              throw new Error(`${label}: anchor is not unique`)
            }
            return source.replace(needle, replacement)
          }

          const comparePath = 'src/campaign/presets/compare-optimization-methods.ts'
          let compare = fs.readFileSync(comparePath, 'utf8')

          compare = replaceOnce(
            compare,
            "} from '../gepa-candidate-population'\nimport { type RunCampaignOptions, runCampaign } from '../run-campaign'",
            "} from '../gepa-candidate-population'\nimport {\n  assertCompleteOptimizationHistory,\n  type OptimizationHistoryReceipt,\n  verifyOptimizationHistoryReceipt,\n} from '../optimization-history'\nimport { type RunCampaignOptions, runCampaign } from '../run-campaign'",
            'history imports',
          )

          compare = replaceOnce(
            compare,
            'export interface OptimizationMethodResult {',
            `export type OptimizationHistoryPolicy = 'allow-missing' | 'require-complete'\n\nexport interface OptimizationMethodHistoryCoverage {\n  readonly methodName: string\n  readonly status: 'complete' | 'incomplete' | 'missing'\n  readonly reasons: readonly string[]\n  readonly receipt?: OptimizationHistoryReceipt\n}\n\nexport interface OptimizationHistoryCoverage {\n  readonly policy: OptimizationHistoryPolicy\n  readonly allComplete: boolean\n  readonly methods: readonly OptimizationMethodHistoryCoverage[]\n}\n\nexport interface OptimizationMethodResult {`,
            'history contract types',
          )

          compare = replaceOnce(
            compare,
            "  /** Exact external implementation and run identity, when the method uses one. */\n  provenance?: OptimizationMethodProvenance\n}",
            "  /** Exact external implementation and run identity, when the method uses one. */\n  provenance?: OptimizationMethodProvenance\n  /** Content-addressed index over this method's canonical search ledger. */\n  history?: OptimizationHistoryReceipt\n}",
            'method result history',
          )

          compare = replaceOnce(
            compare,
            "  /** Exact external implementation and run identity, when reported by the method. */\n  provenance?: OptimizationMethodProvenance\n  /** Paired final-test values used to compute lift and its interval. */",
            "  /** Exact external implementation and run identity, when reported by the method. */\n  provenance?: OptimizationMethodProvenance\n  /** Exact optimization history reported by the method, when present. */\n  history?: OptimizationHistoryReceipt\n  /** Paired final-test values used to compute lift and its interval. */",
            'method score history',
          )

          compare = replaceOnce(
            compare,
            "  best: OptimizationMethodScore\n  /** Best vs each other method, using simultaneous paired-bootstrap intervals. */",
            "  best: OptimizationMethodScore\n  /** Complete, incomplete, or missing search-history coverage in method input order. */\n  optimizationHistory: OptimizationHistoryCoverage\n  /** Best vs each other method, using simultaneous paired-bootstrap intervals. */",
            'comparison history coverage',
          )

          compare = replaceOnce(
            compare,
            "  /** Number of optimization methods to run concurrently. Default 1. */\n  optimizationConcurrency?: number\n  /** Simultaneous confidence across method-vs-baseline and method-vs-method contrasts.",
            "  /** Number of optimization methods to run concurrently. Default 1. */\n  optimizationConcurrency?: number\n  /**\n   * `allow-missing` preserves existing methods while reporting coverage.\n   * `require-complete` refuses before untouched-final-test scoring unless every\n   * method returns a terminal, denominator-complete history receipt.\n   */\n  historyPolicy?: OptimizationHistoryPolicy\n  /** Simultaneous confidence across method-vs-baseline and method-vs-method contrasts.",
            'history policy option',
          )

          compare = replaceOnce(
            compare,
            "  const confidence = opts.confidence ?? 0.95\n  assertConfidence(confidence)",
            "  const confidence = opts.confidence ?? 0.95\n  const historyPolicy = opts.historyPolicy ?? 'allow-missing'\n  assertConfidence(confidence)",
            'resolved history policy',
          )

          compare = replaceOnce(
            compare,
            `      assertOptimizationResult(method.name, out)\n      const winnerSurface = structuredClone(out.winnerSurface)\n      return {\n        name: method.name,\n        winnerSurface,\n        cost: out.cost,\n        durationMs: out.durationMs,\n        provenance: out.provenance,\n      }`,
            `      assertOptimizationResult(method.name, out)\n      const historyCoverage = historyCoverageForMethod(method.name, out.history)\n      if (historyPolicy === 'require-complete') {\n        assertCompleteOptimizationHistory(method.name, out.history)\n      }\n      const winnerSurface = structuredClone(out.winnerSurface)\n      return {\n        name: method.name,\n        winnerSurface,\n        cost: out.cost,\n        historyCoverage,\n        ...(out.durationMs !== undefined ? { durationMs: out.durationMs } : {}),\n        ...(out.provenance !== undefined\n          ? { provenance: structuredClone(out.provenance) }\n          : {}),\n        ...(out.history !== undefined ? { history: out.history } : {}),\n      }`,
            'optimized method result',
          )

          compare = replaceOnce(
            compare,
            "  })\n  assertReportedCostWithinCeiling(\n    combineComparisonCosts(",
            "  })\n  const optimizationHistory: OptimizationHistoryCoverage = Object.freeze({\n    policy: historyPolicy,\n    allComplete: optimized.every((result) => result.historyCoverage.status === 'complete'),\n    methods: Object.freeze(optimized.map((result) => result.historyCoverage)),\n  })\n  assertReportedCostWithinCeiling(\n    combineComparisonCosts(",
            'comparison history summary',
          )

          compare = replaceOnce(
            compare,
            "    if (w.provenance !== undefined) score.provenance = structuredClone(w.provenance)\n    return score",
            "    if (w.provenance !== undefined) score.provenance = structuredClone(w.provenance)\n    if (w.history !== undefined) score.history = w.history\n    return score",
            'score history propagation',
          )

          compare = replaceOnce(
            compare,
            "    scores,\n    best,\n    pairwise,",
            "    scores,\n    best,\n    optimizationHistory,\n    pairwise,",
            'comparison return history',
          )

          compare = replaceOnce(
            compare,
            "  if (result.provenance !== undefined) {\n    assertOptimizationProvenance(name, result.provenance)\n  }\n}",
            "  if (result.provenance !== undefined) {\n    assertOptimizationProvenance(name, result.provenance)\n  }\n  if (result.history !== undefined) historyCoverageForMethod(name, result.history)\n}",
            'result history validation',
          )

          compare = replaceOnce(
            compare,
            "function assertReportedCostWithinCeiling(\n",
            `function historyCoverageForMethod(\n  methodName: string,\n  receipt: OptimizationHistoryReceipt | undefined,\n): OptimizationMethodHistoryCoverage {\n  if (receipt === undefined) {\n    return Object.freeze({\n      methodName,\n      status: 'missing',\n      reasons: Object.freeze(['history receipt is missing']),\n    })\n  }\n  verifyOptimizationHistoryReceipt(receipt)\n  if (receipt.methodName !== methodName) {\n    throw new Error(\n      \`compareOptimizationMethods: method '\${methodName}' returned history for '\${receipt.methodName}'\`,\n    )\n  }\n  return Object.freeze({\n    methodName,\n    status: receipt.historyComplete ? 'complete' : 'incomplete',\n    reasons: Object.freeze([...receipt.incompleteReasons]),\n    receipt,\n  })\n}\n\nfunction assertReportedCostWithinCeiling(\n`,
            'history coverage helper',
          )

          compare = replaceOnce(
            compare,
            "  if (\n    opts.optimizationRunOptions &&\n    'costCeiling' in (opts.optimizationRunOptions as unknown as Record<string, unknown>)\n  ) {",
            "  if (\n    opts.historyPolicy !== undefined &&\n    opts.historyPolicy !== 'allow-missing' &&\n    opts.historyPolicy !== 'require-complete'\n  ) {\n    throw new Error(\n      \`compareOptimizationMethods: unknown historyPolicy '\${String(opts.historyPolicy)}'\`,\n    )\n  }\n  if (\n    opts.optimizationRunOptions &&\n    'costCeiling' in (opts.optimizationRunOptions as unknown as Record<string, unknown>)\n  ) {",
            'history policy validation',
          )

          fs.writeFileSync(comparePath, compare)

          const indexPath = 'src/campaign/index.ts'
          let index = fs.readFileSync(indexPath, 'utf8')
          const obsoleteWrapperExport = `export {\n  compareOptimizationMethodsWithHistory,\n  type CompareOptimizationMethodsWithHistoryOptions,\n  type HistoryAwareOptimizationMethod,\n  type HistoryAwareOptimizationMethodResult,\n  type OptimizationHistoryCoverage,\n  type OptimizationHistoryPolicy,\n  type OptimizationMethodComparisonWithHistory,\n  type OptimizationMethodHistoryCoverage,\n} from './presets/compare-optimization-methods-with-history'\n`
          index = index.replace(obsoleteWrapperExport, '')
          index = replaceOnce(
            index,
            "  type OptimizationMethod,\n  type OptimizationMethodComparison,",
            "  type OptimizationHistoryCoverage,\n  type OptimizationHistoryPolicy,\n  type OptimizationMethod,\n  type OptimizationMethodComparison,\n  type OptimizationMethodHistoryCoverage,",
            'campaign history type exports',
          )
          const ledgerAnchor = '// ── Durable improvement-search audit log ────────────────────────────\n'
          const historyExport = `// ── Content-addressed complete optimization history ─────────────────\nexport {\n  assertCompleteOptimizationHistory,\n  assertOptimizationHistoryMatchesReplay,\n  type CreateOptimizationHistoryReceiptInput,\n  createOptimizationHistoryReceipt,\n  type OptimizationHistoryEntityIndex,\n  type OptimizationHistoryEventIndex,\n  type OptimizationHistoryReceipt,\n  OptimizationHistoryRequiredError,\n  OPTIMIZATION_HISTORY_RECEIPT_DIGEST_ALGORITHM,\n  OPTIMIZATION_HISTORY_RECEIPT_SCHEMA_VERSION,\n  verifyOptimizationHistoryReceipt,\n} from './optimization-history'\n`
          if (!index.includes(historyExport)) {
            index = replaceOnce(index, ledgerAnchor, `${historyExport}${ledgerAnchor}`, 'history exports')
          }
          fs.writeFileSync(indexPath, index)

          const historyTestPath = 'src/campaign/optimization-history.test.ts'
          let historyTest = fs.readFileSync(historyTestPath, 'utf8')
          const partialAccounting =
            "replay.audit = { ...replay.audit, accounting: { ...replay.audit.accounting, costUsd: 2 } }"
          if (historyTest.includes(partialAccounting)) {
            historyTest = historyTest.replace(
              partialAccounting,
              "replay.audit = {\n      ...replay.audit,\n      accounting: {\n        status: 'known',\n        inputTokens: 10,\n        outputTokens: 2,\n        cachedTokens: 0,\n        costUsd: 2,\n      },\n    }",
            )
          }
          fs.writeFileSync(historyTestPath, historyTest)

          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          const quickstartAnchor = 'Runnable copy: [`examples/evaluate-a-change`](./examples/evaluate-a-change/).\n'
          const historySection = `\n## Optimization History: the Flight Recorder\n\nA winner is not the same thing as a record of the search that produced it. Optimization methods may return a content-addressed history receipt that points to Eval's canonical hash-chained search ledger.\n\n- The ledger retains every candidate, task attempt, operation, refusal, decision, accounting gap, and terminal outcome.\n- The receipt indexes those exact bytes without inventing a second history format.\n- \`historyPolicy: 'allow-missing'\` keeps existing methods source-compatible and reports coverage.\n- \`historyPolicy: 'require-complete'\` refuses before untouched-final-test scoring unless every method has complete history.\n\n\`comparison.optimizationHistory\` reports \`complete\`, \`incomplete\`, or \`missing\` for every method. Each scored method also retains its exact \`history\` receipt. See [complete optimization history](./docs/optimization-history.md) for the copy-paste integration and the precise proof boundary.\n`
          if (!readme.includes('## Optimization History: the Flight Recorder')) {
            readme = replaceOnce(
              readme,
              quickstartAnchor,
              `${quickstartAnchor}${historySection}`,
              'README history section',
            )
          }
          const docsAnchor =
            '| How do I choose a candidate-generation method? | [`docs/campaign-proposers.md`](./docs/campaign-proposers.md) |\n'
          const docsRow =
            '| How do I retain every optimizer attempt and fail closed on gaps? | [`docs/optimization-history.md`](./docs/optimization-history.md) |\n'
          if (!readme.includes(docsRow)) {
            readme = replaceOnce(readme, docsAnchor, `${docsAnchor}${docsRow}`, 'README docs row')
          }
          fs.writeFileSync(readmePath, readme)

          fs.rmSync('src/campaign/presets/compare-optimization-methods-with-history.ts', {
            force: true,
          })
          fs.rmSync('src/campaign/presets/compare-optimization-methods-with-history.test.ts', {
            force: true,
          })
          EOF

          pnpm biome check --write \
            README.md \
            docs/optimization-history.md \
            src/campaign/index.ts \
            src/campaign/optimization-history.ts \
            src/campaign/optimization-history.test.ts \
            src/campaign/presets/compare-optimization-methods.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts
      - name: Validate the canonical contract
        run: |
          pnpm typecheck
          pnpm test -- \
            src/campaign/optimization-history.test.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts
          pnpm build
      - name: Commit the implementation and remove this one-time workflow
        run: |
          rm .github/workflows/wire-complete-optimization-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(history): retain complete optimization search evidence"
          git push
