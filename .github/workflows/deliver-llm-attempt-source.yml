name: Deliver exact LLM attempt source
on:
  push:
    branches: [delivery/llm-attempt-budget-source]
    paths: [.github/workflows/deliver-llm-attempt-source.yml]
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'tangle-network/agent-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import two preverified files without running candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo = 'tangle-network/agent-eval'
          branch = 'fix/shared-llm-attempt-budget'
          parent = 'f03bd8d0c6b9db6249163fbd4dc3c9e2b35ad530'
          files = {
              'src/llm-client.ts': ('28b4dc2d2e897ff0dbf9212febf07b15033213d8', '23de1b3c4ca8dec0e18bf2447366cc3e445cc352'),
              'src/llm-client.test.ts': ('42327d0c2361ac531a1b1ee6c7ed5a720edcb2d9', 'af0ee306f9b8786cd0109278f306a2aa29b5feae'),
          }
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('Expected one exact source replacement')
              return text.replace(old, new, 1)
          def rewrite(path, text):
              if path == 'src/llm-client.test.ts':
                  text = replace_once(text, "it('reserves both request batches when schema fallback is possible'", "it('shares the physical attempt limit with schema fallback'")
                  text = replace_once(text, "expect(structured && 'outputTokens' in structured ? structured.outputTokens : 0).toBe(1_600)", "expect(structured && 'outputTokens' in structured ? structured.outputTokens : 0).toBe(800)")
                  return replace_once(text, 'expect(inputTokens(requestDisabled) - inputTokens(providerDefault)).toBe(124)', 'expect(inputTokens(requestDisabled) - inputTokens(providerDefault)).toBe(62)')
              text = replace_once(text, '/** Total provider attempts the transport may make for this call. Default 3. */', '/** Total physical requests, including retries and schema/temperature fallback. Default 3. */')
              text = replace_once(text, '  // A rejected response schema can trigger one JSON-mode batch with the same output limit.\n  const batches = request.jsonSchema && !forceJsonObject ? 2 : 1\n  const usage = {\n    inputTokens: requestBytes * attempts * batches,\n    outputTokens: request.maxTokens * attempts * batches,\n  }', '  // Schema fallback shares the same physical-attempt budget; it cannot buy a second batch.\n  const usage = {\n    inputTokens: requestBytes * attempts,\n    outputTokens: request.maxTokens * attempts,\n  }')
              start = 'export async function callLlm(\n  req: LlmCallRequest,\n  opts: LlmClientOptions = {},\n): Promise<LlmCallResult> {\n'
              addition = '  return callLlmAttempts(req, opts, false)\n}\n\n/** One retry owner for raw and structured calls. Fallback changes the next\n * request, not the attempt allowance, deadline origin, or raw-event sequence. */\nasync function callLlmAttempts(\n  req: LlmCallRequest,\n  opts: LlmClientOptions,\n  allowSchemaFallback: boolean,\n): Promise<LlmCallResult> {\n'
              text = replace_once(text, start, start + addition)
              anchor = '        if (\n          RETRYABLE_STATUS.has(res.status) &&'
              fallback = "        if (\n          allowSchemaFallback &&\n          opts.jsonSchemaTransport !== 'json-object' &&\n          effectiveRequest.jsonSchema &&\n          isSchemaRejection(res.status, body) &&\n          attempt < maximumAttempts - 1 &&\n          !deadlineExceeded(deadlineStart, deadlineMs)\n        ) {\n          lastErr = err\n          effectiveRequest = { ...effectiveRequest, jsonMode: true, jsonSchema: undefined }\n          continue\n        }\n"
              text = replace_once(text, anchor, fallback + anchor)
              old = "  try {\n    return await callLlm({ ...req, jsonMode: req.jsonMode ?? !req.jsonSchema }, opts)\n  } catch (err) {\n    if (\n      opts.jsonSchemaTransport !== 'json-object' &&\n      err instanceof LlmCallError &&\n      isSchemaRejection(err.status, err.body) &&\n      req.jsonSchema\n    ) {\n      const degradedReq: LlmCallRequest = { ...req, jsonMode: true, jsonSchema: undefined }\n      return await callLlm(degradedReq, opts)\n    }\n    throw err\n  }"
              return replace_once(text, old, '  return callLlmAttempts({ ...req, jsonMode: req.jsonMode ?? !req.jsonSchema }, opts, true)')
          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=body, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          def digest(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          def require_head():
              if api('GET', 'git/ref/heads/' + branch)['object']['sha'] != parent:
                  raise RuntimeError('Feature branch changed; refusing overwrite')
          require_head()
          parent_tree = api('GET', 'git/commits/' + parent)['tree']['sha']
          replacements = []
          for path, (before, after) in files.items():
              row = api('GET', 'contents/' + path + '?ref=' + parent)
              content = base64.b64decode(row['content'])
              if row['sha'] != before or digest(content) != before:
                  raise RuntimeError('Baseline changed: ' + path)
              updated = rewrite(path, content.decode()).encode()
              if digest(updated) != after:
                  raise RuntimeError('Result differs from tested source: ' + path)
              replacements.append((path, after, updated))
          entries = []
          for path, after, updated in replacements:
              row = api('POST', 'git/blobs', {'content': updated.decode(), 'encoding': 'utf-8'})
              if row['sha'] != after:
                  raise RuntimeError('Uploaded blob differs: ' + path)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': after})
          tree = api('POST', 'git/trees', {'base_tree': parent_tree, 'tree': entries})
          commit = api('POST', 'git/commits', {'message': 'fix(llm): share physical attempt budget and deadline across fallbacks',
              'tree': tree['sha'], 'parents': [parent]})
          require_head()
          api('PATCH', 'git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False})
          print(json.dumps({'branch': branch, 'commit': commit['sha'], 'tree': tree['sha'], 'files': entries}, indent=2))
          PY
