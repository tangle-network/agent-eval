name: Finalize finding validation parity

on:
  push:
    branches:
      - fix/finding-validation-parity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/finding-validation-parity
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Preserve escaped newlines in generated Python
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/finalize-finding-validation-parity.py')
          text = path.read_text()
          replacements = {
              r'f"ANSWER:\n{answer_text}"': r'f"ANSWER:\\n{answer_text}"',
              r'f"SUBMITTED_FINDINGS:\n{raw_findings_json.strip()}"': r'f"SUBMITTED_FINDINGS:\\n{raw_findings_json.strip()}"',
              r'repair_source = "\n\n".join(repair_parts)': r'repair_source = "\\n\\n".join(repair_parts)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'newline escape anchor {old!r}: expected one, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Apply the cross-language contract repair
        run: |
          python .github/scripts/finalize-finding-validation-parity.py
          python -m py_compile \
            clients/python/src/agent_eval_rpc/dspy_rlm_bridge.py \
            clients/python/src/agent_eval_rpc/finding_subject.py \
            clients/python/tests/test_dspy_rlm_bridge.py \
            clients/python/tests/test_finding_validation_parity.py

      - name: Format JavaScript and TypeScript changes
        run: |
          pnpm exec biome check --write \
            tests/finding-validation-parity.test.ts \
            src/analyst/benchmark-implementation.ts \
            src/analyst/benchmark-implementation.test.ts \
            scripts/check-analyst-benchmark-implementation.mjs

      - name: Format Python changes
        run: |
          uv run --project clients/python --extra dspy --extra dev ruff format \
            clients/python/src/agent_eval_rpc/dspy_rlm_bridge.py \
            clients/python/src/agent_eval_rpc/finding_subject.py \
            clients/python/tests/test_dspy_rlm_bridge.py \
            clients/python/tests/test_finding_validation_parity.py
          uv run --project clients/python --extra dspy --extra dev ruff check --fix \
            clients/python/src/agent_eval_rpc/dspy_rlm_bridge.py \
            clients/python/src/agent_eval_rpc/finding_subject.py \
            clients/python/tests/test_dspy_rlm_bridge.py \
            clients/python/tests/test_finding_validation_parity.py

      - name: Refresh Python lock and benchmark digests
        run: |
          uv lock --project clients/python
          python .github/scripts/finalize-finding-validation-parity.py --digests
          node scripts/check-analyst-benchmark-implementation.mjs

      - name: Validate the complete implementation
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run typecheck:examples
          pnpm run typecheck:scripts
          pnpm test
          pnpm run build
          uv run --project clients/python --extra dspy --extra dev ruff check \
            clients/python/src clients/python/tests
          uv run --project clients/python --extra dspy --extra dev pytest -q

      - name: Commit the validated repair
        shell: bash
        run: |
          rm .github/workflows/finalize-finding-validation-parity.yml
          rm .github/scripts/finalize-finding-validation-parity.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No parity repair changes to commit"; exit 1; }
          git commit -m "fix: enforce finding validation parity across TypeScript and Python"
          git push origin HEAD:fix/finding-validation-parity
