name: Diagnose packed package export

on:
  push:
    branches:
      - codex/pursuit-evidence-receipts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Capture packed-export verifier output
        run: |
          mkdir -p diagnostics
          set +e
          pnpm run verify:package > diagnostics/verify-package.log 2>&1
          status=$?
          set -e
          {
            echo
            echo "exit_status=$status"
          } >> diagnostics/verify-package.log
          cat diagnostics/verify-package.log

      - name: Upload verifier diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-packed-export-diagnostic
          path: diagnostics/verify-package.log
          if-no-files-found: error
