name: Diagnose packed package export

on:
  push:
    branches:
      - codex/pursuit-evidence-receipts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Align dependency cohort with current main
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const packagePath = 'package.json'
          const packageSource = await readFile(packagePath, 'utf8')
          const oldDependency = '"@tangle-network/agent-interface": "^1.0.0"'
          const newDependency = '"@tangle-network/agent-interface": "^1.0.1"'
          if (!packageSource.includes(oldDependency)) throw new Error('old package dependency not found')
          await writeFile(packagePath, packageSource.replace(oldDependency, newDependency))

          const verifierPath = 'scripts/verify-package-exports.mjs'
          const verifierSource = await readFile(verifierPath, 'utf8')
          const oldCohort = "'@tangle-network/agent-interface': { range: '^1.0.0', version: '1.0.0' }"
          const newCohort = "'@tangle-network/agent-interface': { range: '^1.0.1', version: '1.0.1' }"
          if (!verifierSource.includes(oldCohort)) throw new Error('old verifier cohort not found')
          await writeFile(verifierPath, verifierSource.replace(oldCohort, newCohort))
          NODE

      - name: Refresh lockfile and install dependencies
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Build package
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Capture packed-export verifier output
        run: |
          mkdir -p diagnostics
          set +e
          pnpm run verify:package > diagnostics/verify-package.log 2>&1
          status=$?
          set -e
          {
            echo
            echo "exit_status=$status"
          } >> diagnostics/verify-package.log
          cat diagnostics/verify-package.log

      - name: Upload cohort repair and verifier diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-packed-export-diagnostic
          path: |
            package.json
            pnpm-lock.yaml
            scripts/verify-package-exports.mjs
            diagnostics/verify-package.log
          if-no-files-found: error
