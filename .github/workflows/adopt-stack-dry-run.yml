# Exercise the reusable adoption workflow on every push. agent-eval's own
# @tangle-network ranges already cover npm latest, so its plan is usually empty
# and this caller proves only the workflow wiring and the pushed script against
# the registry. scripts/adopt-stack.test.mjs proves the plans (two recorded
# caller manifests) and the delivery path (local git remote, stand-in gh).
name: Adopt stack (dry run)

on:
  push:

permissions:
  contents: read

jobs:
  adopt:
    uses: ./.github/workflows/adopt-stack.yml
    with:
      dry-run: true
      stack-ref: ${{ github.sha }}
      default-branch: ${{ github.ref_name }}
