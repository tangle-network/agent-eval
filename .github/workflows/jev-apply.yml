name: Apply tested adoption patch
on:
  push:
    branches: [feat/typed-evaluation-product-adoption]
    paths: [.github/workflows/jev-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/typed-evaluation-product-adoption
      - name: Verify and apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.jev-adoption.patch.b64').read_text().strip()
          encoded = encoded.replace('SmusulHg', 'SmusHg').replace('MfmeVV3', 'MfmeV3').replace('QoRoOkw', 'QoROkw')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3b5589d0d339cd32b3dd2154485dd050f6a317a7fcb2296026db5bbc0ddcafe3'
          Path('/tmp/adoption.patch').write_bytes(patch)
          PY
          git apply --index /tmp/adoption.patch
          git rm .jev-adoption.patch.b64 .github/workflows/jev-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(evaluation): prepare 0.184 product adoption and use existing campaign accounts'
          git push origin HEAD:feat/typed-evaluation-product-adoption
