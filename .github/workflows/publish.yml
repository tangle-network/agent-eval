name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Verify both packages build and pass tests, in lockstep.
  # If either fails, neither publishes.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck JS
        run: pnpm typecheck

      - name: Test JS
        run: pnpm test

      - name: Build JS and emit OpenAPI spec
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Verify packed package exports
        run: pnpm run verify:package

      - name: Verify version lock between npm and PyPI packages
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          PY_VERSION=$(grep -E '^version' clients/python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PY_RUNTIME_VERSION=$(python -c "import pathlib,re; text=pathlib.Path('clients/python/src/agent_eval_rpc/__init__.py').read_text(); match=re.search(r'__version__ = \"([^\"]+)\"', text); print(match.group(1) if match else '')")
          if [ "$NPM_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: npm=$NPM_VERSION pypi=$PY_VERSION. Bump them together."
            exit 1
          fi
          if [ -n "$PY_RUNTIME_VERSION" ] && [ "$NPM_VERSION" != "$PY_RUNTIME_VERSION" ]; then
            echo "::error::Version mismatch: npm=$NPM_VERSION python_runtime=$PY_RUNTIME_VERSION. Bump them together."
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
              echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
              exit 1
            fi
          fi
          echo "Versions locked: $NPM_VERSION"

      - name: Install Python client
        working-directory: clients/python
        run: uv sync --frozen --extra dev --group skillopt-source --group gepa-source

      - name: Test Python client with official GEPA
        working-directory: clients/python
        run: uv run --frozen --extra dev --group skillopt-source --group gepa-source pytest -v

      - name: Test TypeScript official optimizer integrations
        env:
          AGENT_EVAL_TEST_PYTHON: ${{ github.workspace }}/clients/python/.venv/bin/python
        run: >-
          pnpm exec vitest run
          tests/campaign/gepa-official-integration.test.ts
          tests/campaign/skillopt-official-integration.test.ts

      - name: Install published GEPA
        working-directory: clients/python
        run: uv sync --frozen --extra dev --group gepa-release

      - name: Test published GEPA compatibility
        working-directory: clients/python
        env:
          AGENT_EVAL_EXPECT_GEPA_RELEASE: '1'
        run: >-
          uv run --frozen --extra dev --group gepa-release
          pytest -v
          tests/test_gepa_release_compatibility.py
          tests/test_gepa_bridge.py
          tests/test_official_optimizer_compatibility.py::test_agent_eval_gepa_bridge_resumes_state_from_a_real_prior_run

      - name: Test TypeScript bridge with published GEPA
        env:
          AGENT_EVAL_TEST_PYTHON: ${{ github.workspace }}/clients/python/.venv/bin/python
        run: pnpm exec vitest run tests/campaign/gepa-official-integration.test.ts

      - name: Install DSPy environment
        working-directory: clients/python
        run: uv sync --frozen --extra dev --extra dspy

      - name: Test DSPy metric adapter
        working-directory: clients/python
        run: uv run --frozen --extra dev --extra dspy pytest -v tests/test_dspy_metric.py

      - name: Verify publishable Python distributions
        working-directory: clients/python
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          python scripts/verify_publishable_dist.py dist

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: dist/openapi.json
          # `pnpm build` makes this spec again from the tagged commit.
          retention-days: 7

      - name: Upload Python build context
        uses: actions/upload-artifact@v7
        with:
          name: python-source
          path: clients/python
          # No job downloads this. It only shows why a publish failed, and the
          # tagged commit makes the same tree again. One week is sufficient to
          # examine a failed release.
          retention-days: 7

  publish-npm:
    needs: verify
    # Publish on a v* tag OR a manual dispatch — tokenless by default. The
    # Trusted Publisher on npmjs (package Settings → Trusted Publisher → GitHub
    # Actions: org tangle-network, repo agent-eval, workflow publish.yml, no
    # environment) mints a short-lived credential from the id-token — no
    # NPM_TOKEN, nothing to rotate, plus a provenance attestation.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Attest every publish on both the OIDC path and the token fallback. The
      # `--provenance` flag says the same thing; the variable also covers a
      # publish an npm lifecycle script starts.
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # The id-token→publish-credential exchange is an npm-CLI feature (>= 11.5.1)
      # and Node 22 bundles npm 10, so install the CLI that can do the exchange.
      # npm 12.0.0 (2026-07) ships a broken provenance publish (libnpmpublish
      # requires 'sigstore' without bundling it), so pin an exact 11.x release
      # instead of a floating range, the same pin agent-sdk release.yml carries.
      - name: Pin the npm CLI that supports trusted publishing
        run: |
          npm install -g npm@11.18.0
          test "$(npm --version)" = '11.18.0'

      # Tokenless by default. NPM_TOKEN is a break-glass fallback for repairing a
      # publish by hand; it is not set, and a token set here TAKES PRECEDENCE over
      # OIDC (agent-sdk #284: a repo token whose package scope missed three
      # packages made every publish 404 on the PUT), so leave it unset.
      - name: Configure npm auth (OIDC by default, token only when set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An empty _authToken line also blocks the exchange, so drop any line a
          # previous step wrote and write one back only for a real token.
          sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set --location=user //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo 'NPM_TOKEN is set: publishing with the token fallback, still attested.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing (OIDC).'
          fi

      # pnpm only signs provenance — its PUT then 404s on auth — so publish with
      # npm. agent-eval has no `workspace:` deps, so `npm publish` is safe here.
      # Idempotent: a version already on the registry is skipped so the downstream
      # PyPI step still runs.
      - name: Publish to npm (OIDC trusted publishing)
        env:
          # `npm publish` re-runs the `prepublishOnly` build hook. Match the heap
          # used by the standalone build steps for deterministic release builds.
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on registry; skipping publish"
          else
            npm publish --provenance --access public --registry=https://registry.npmjs.org
          fi

  publish-pypi:
    # PyPI must not publish a version npm failed to publish. The npm job is
    # idempotent and succeeds when the version is already on the registry, so
    # reruns can still repair a missing PyPI artifact without creating skew.
    needs: [verify, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel + sdist
        working-directory: clients/python
        run: python -m build

      - name: Check whether this version is already on PyPI
        id: pypi-check
        run: |
          VERSION=$(grep -E '^version' clients/python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if curl -sf "https://pypi.org/pypi/agent-eval-rpc/$VERSION/json" >/dev/null; then
            echo "agent-eval-rpc==$VERSION already on PyPI; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (trusted publishing)
        if: steps.pypi-check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
