name: Finalize bounded search history receipt

on:
  push:
    branches: [feat/search-history-receipts-v1]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/search-history-receipts-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Remove temporary exports and polish the public surface
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const receiptPath = 'src/campaign/search-history-receipt.ts'
          let receipt = fs.readFileSync(receiptPath, 'utf8')
          receipt = receipt.replace('  SearchLedgerEvent,\n', '')
          receipt = receipt.replace(
            /\/\/ TEMPORARY EXPORT COMPATIBILITY START[\s\S]*?\/\/ TEMPORARY EXPORT COMPATIBILITY END\n\n/,
            '',
          )
          if (receipt.includes('TEMPORARY EXPORT COMPATIBILITY')) {
            throw new Error('temporary receipt compatibility block was not removed')
          }
          fs.writeFileSync(receiptPath, receipt)

          const indexPath = 'src/campaign/index.ts'
          let index = fs.readFileSync(indexPath, 'utf8')
          index = index.replace('  type SearchHistoryEntityIndex,\n', '')
          index = index.replace('  type SearchHistoryEventIndex,\n', '')
          if (!index.includes('  type SearchHistoryAuditSummary,\n')) {
            index = index.replace(
              '  type SearchHistoryCoverage,\n',
              '  type SearchHistoryAuditSummary,\n  type SearchHistoryCoverage,\n',
            )
          }
          fs.writeFileSync(indexPath, index)

          const comparePath = 'src/campaign/presets/compare-optimization-methods.ts'
          let compare = fs.readFileSync(comparePath, 'utf8')
          compare = compare.replace(
            '/** Compact proof/index over the canonical SearchLedger for this optimization. */',
            '/** Bounded proof envelope over the canonical SearchLedger for this optimization. */',
          )
          fs.writeFileSync(comparePath, compare)

          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          readme = readme.replace(/\n## Auditable optimization history[\s\S]*$/, '\n')
          const readmeSection = `## Auditable optimization history

Optimization methods may return a bounded \`SearchHistoryReceipt\` over Eval's canonical hash-chained \`SearchLedger\`. Existing callers keep working and see missing-history coverage. Autonomous and publication-grade runs set \`searchHistoryPolicy: 'require-complete'\` to refuse an incomplete planned denominator before the untouched final cases are opened.

The receipt is a small proof envelope, not another event log. Exact candidates, attempts, failures, decisions, and missing ids remain in the ledger. See [complete optimization search history](./docs/search-history-receipts.md).

`
          const frontDoor = '## Which Front Door\n'
          if (!readme.includes(frontDoor)) throw new Error('README front-door anchor not found')
          readme = readme.replace(frontDoor, `${readmeSection}${frontDoor}`)
          fs.writeFileSync(readmePath, readme)

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          if (!changelog.includes('bounded `SearchHistoryReceipt`')) {
            const anchor = '## [Unreleased]\n\n---\n'
            if (!changelog.includes(anchor)) throw new Error('CHANGELOG Unreleased anchor not found')
            changelog = changelog.replace(
              anchor,
              `## [Unreleased]

### Added

- Add a bounded \`SearchHistoryReceipt\` over the canonical \`SearchLedger\`, plus search-history coverage and \`searchHistoryPolicy: 'require-complete'\` on \`compareOptimizationMethods()\`. Strict mode refuses missing or denominator-incomplete optimization evidence before untouched-final-test scoring. Rich events remain only in the ledger.

---
`,
            )
          }
          fs.writeFileSync(changelogPath, changelog)
          NODE

          pnpm biome check --write \
            README.md \
            CHANGELOG.md \
            docs/search-history-receipts.md \
            src/campaign/index.ts \
            src/campaign/search-history-receipt.ts \
            src/campaign/search-history-receipt.test.ts \
            src/campaign/presets/compare-optimization-methods.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts

      - name: Validate focused behavior and the complete JS package
        run: |
          pnpm lint
          pnpm run check:model-ids
          pnpm typecheck
          pnpm typecheck:examples
          pnpm typecheck:scripts
          pnpm test -- \
            src/campaign/search-history-receipt.test.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts
          pnpm test
          pnpm build
          pnpm run verify:package

      - name: Commit validated code and remove one-time machinery
        run: |
          rm -f .github/workflows/minimize-search-history-receipt.yml
          rm -f .github/workflows/simplify-search-history-receipt.yml
          rm -f .github/workflows/audit-search-history-receipts.yml
          rm -f .github/workflows/finalize-search-history-receipts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refactor(history): keep one bounded proof envelope"
          git push
