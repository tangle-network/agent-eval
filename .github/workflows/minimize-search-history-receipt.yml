name: Minimize search history receipt

on:
  push:
    branches: [feat/search-history-receipts-v1]

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/search-history-receipts-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove shadow indexes from the receipt
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = 'src/campaign/search-history-receipt.ts'
          let source = fs.readFileSync(path, 'utf8')

          source = source.replace(
            /\/\*\* One addressable event in the canonical ledger[\s\S]*?export interface SearchHistoryEntityIndex \{[\s\S]*?\n\}\n\n/,
            '',
          )
          source = source.replace(
            / \*\n \* A tamper-evident table of contents for one verified SearchLedger replay\.[\s\S]*? \*\/\nexport interface SearchHistoryReceipt/,
            `/**\n * A constant-size proof envelope over one verified SearchLedger replay.\n *\n * The content-addressed ledger artifact remains the sole rich history. The\n * receipt binds its producer/run identity, verified replay audit, explicit\n * completeness classification, and its own canonical digest. Consumers that\n * need candidates, attempts, failures, or decisions read the canonical ledger.\n */\nexport interface SearchHistoryReceipt`,
          )
          source = source.replace(
            `  readonly events: readonly SearchHistoryEventIndex[]\n  readonly entities: SearchHistoryEntityIndex\n`,
            '',
          )
          source = source.replace(
            /  const events = Object\.freeze\([\s\S]*?\n  \)\n  const entities = Object\.freeze\([\s\S]*?\n  \}\)\n/,
            '',
          )
          source = source.replace(`    events,\n    entities,\n`, '')
          source = source.replace(
            /  if \(receipt\.audit\.eventCount !== receipt\.events\.length\) \{[\s\S]*?\n  \}\n  receipt\.events\.forEach\([\s\S]*?\n  \}\)\n/,
            '',
          )
          source = source.replace(`    events: receipt.events,\n    entities: receipt.entities,\n`, '')
          source = source.replace(
            /\nfunction freezeUnique\(values: readonly string\[\]\): readonly string\[\] \{[\s\S]*?\n\}\n/,
            '\n',
          )
          fs.writeFileSync(path, source)

          const testPath = 'src/campaign/search-history-receipt.test.ts'
          let test = fs.readFileSync(testPath, 'utf8')
          test = test.replace(
            "  it('indexes every canonical event and entity without copying rich history records', () => {",
            "  it('binds the verified audit and ledger artifact without copying rich history records', () => {",
          )
          test = test.replace(
            /    expect\(value\.events\.map\([\s\S]*?    expect\(value\.entities\)\.toEqual\([\s\S]*?    \}\)\n/,
            `    expect(value.audit.eventCount).toBe(6)\n    expect(value.audit.candidateCount).toBe(1)\n    expect(value.audit.attemptCount).toBe(1)\n    expect(value.audit.operationCount).toBe(1)\n    expect(value.audit.selectedCandidateId).toBe('candidate-a')\n`,
          )
          test = test.replace(
            `        entities: { ...value.entities, runIds: ['forged-run'] },\n`,
            `        runId: 'forged-run',\n`,
          )
          fs.writeFileSync(testPath, test)

          const indexPath = 'src/campaign/index.ts'
          let index = fs.readFileSync(indexPath, 'utf8')
          index = index.replace(`  type SearchHistoryEntityIndex,\n`, '')
          index = index.replace(`  type SearchHistoryEventIndex,\n`, '')
          fs.writeFileSync(indexPath, index)

          for (const docPath of ['README.md', 'docs/search-history-receipts.md']) {
            let doc = fs.readFileSync(docPath, 'utf8')
            doc = doc.replaceAll('tamper-evident table of contents', 'constant-size proof envelope')
            doc = doc.replaceAll('tamper-evident table of contents', 'constant-size proof envelope')
            doc = doc.replaceAll('table of contents', 'proof envelope')
            doc = doc.replace(
              /\n- an addressable event index;\n- compact candidate\/run\/operation\/decision inventories;/g,
              '',
            )
            fs.writeFileSync(docPath, doc)
          }
          EOF
          pnpm biome check --write \
            src/campaign/search-history-receipt.ts \
            src/campaign/search-history-receipt.test.ts \
            src/campaign/index.ts \
            src/campaign/presets/compare-optimization-methods.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts \
            docs/search-history-receipts.md \
            README.md
      - name: Validate focused and full package behavior
        run: |
          pnpm typecheck
          pnpm test -- \
            src/campaign/search-history-receipt.test.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts
          pnpm build
          pnpm lint
          pnpm test
      - name: Commit and remove all one-time workflows
        run: |
          rm -f .github/workflows/minimize-search-history-receipt.yml
          rm -f .github/workflows/simplify-search-history-receipt.yml
          rm -f .github/workflows/audit-search-history-receipts.yml
          rm -f .github/workflows/finalize-search-history-receipts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refactor(history): make the receipt a constant-size proof envelope"
          git push
