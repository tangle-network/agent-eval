name: Audit search history receipts

on:
  push:
    branches: [feat/search-history-receipts-v1]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/search-history-receipts-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Ensure the additive core integration and polished docs
        run: |
          node <<'EOF'
          const fs = require('node:fs')

          const comparePath = 'src/campaign/presets/compare-optimization-methods.ts'
          let compare = fs.readFileSync(comparePath, 'utf8')

          const insertAfter = (anchor, addition, label) => {
            if (compare.includes(addition.trim())) return
            if (!compare.includes(anchor)) throw new Error(`${label} anchor not found`)
            compare = compare.replace(anchor, `${anchor}${addition}`)
          }

          insertAfter(
            "import { surfaceContentHash } from '../surface-identity'\n",
            "import {\n  assertCompleteSearchHistory,\n  type SearchHistoryCoverage,\n  type SearchHistoryPolicy,\n  type SearchHistoryReceipt,\n  searchHistoryCoverageRow,\n} from '../search-history-receipt'\n",
            'search-history imports',
          )
          insertAfter(
            "  /** Exact external implementation and run identity, when the method uses one. */\n  provenance?: OptimizationMethodProvenance\n",
            "  /** Compact proof/index over the canonical SearchLedger for this optimization. */\n  searchHistory?: SearchHistoryReceipt\n",
            'OptimizationMethodResult.searchHistory',
          )
          insertAfter(
            "  /** Agent runs averaged within each test scenario before resampling scenarios. */\n  reps: number\n",
            "  /** Coverage of every method's canonical search history. */\n  searchHistory: SearchHistoryCoverage\n",
            'OptimizationMethodComparison.searchHistory',
          )
          insertAfter(
            "  /** Shared spend limit across every method's optimizer and evaluation calls plus final scoring. */\n  costCeiling?: number\n",
            "  /**\n   * Missing history is reported by default. Autonomous or publication-grade\n   * callers use `require-complete`, which fails before final-test scoring.\n   */\n  searchHistoryPolicy?: SearchHistoryPolicy\n",
            'CompareOptimizationMethodsOptions.searchHistoryPolicy',
          )
          insertAfter(
            "  assertOptimizationMethods(opts.methods)\n  assertComparisonPartitions(opts)\n",
            "  const searchHistoryPolicy = opts.searchHistoryPolicy ?? 'allow-missing'\n  if (searchHistoryPolicy !== 'allow-missing' && searchHistoryPolicy !== 'require-complete') {\n    throw new TypeError(\n      `compareOptimizationMethods: unknown searchHistoryPolicy '${String(searchHistoryPolicy)}'`,\n    )\n  }\n",
            'search-history policy validation',
          )

          if (!compare.includes('const searchHistoryCoverage = searchHistoryCoverageRow(')) {
            const before = `      assertOptimizationResult(method.name, out)\n      const winnerSurface = structuredClone(out.winnerSurface)\n      return {\n        name: method.name,\n        winnerSurface,\n        cost: out.cost,\n        durationMs: out.durationMs,\n        provenance: out.provenance,\n      }`
            const after = `      assertOptimizationResult(method.name, out)\n      const searchHistoryCoverage = searchHistoryCoverageRow(method.name, out.searchHistory)\n      if (searchHistoryPolicy === 'require-complete') {\n        assertCompleteSearchHistory(method.name, out.searchHistory)\n      }\n      const winnerSurface = structuredClone(out.winnerSurface)\n      return {\n        name: method.name,\n        winnerSurface,\n        cost: out.cost,\n        ...(out.durationMs === undefined ? {} : { durationMs: out.durationMs }),\n        ...(out.provenance === undefined ? {} : { provenance: out.provenance }),\n        searchHistoryCoverage,\n      }`
            if (!compare.includes(before)) throw new Error('method-result projection anchor not found')
            compare = compare.replace(before, after)
          }

          if (!compare.includes('policy: searchHistoryPolicy')) {
            const functionStart = compare.indexOf(
              'export async function compareOptimizationMethods<TScenario extends Scenario, TArtifact>',
            )
            const nextFunction = compare.indexOf('\nfunction ', functionStart)
            if (functionStart < 0 || nextFunction < 0) throw new Error('comparison function boundary not found')
            const body = compare.slice(functionStart, nextFunction)
            const returnStart = body.lastIndexOf('\n  return {')
            const returnClose = body.lastIndexOf('\n  }')
            if (returnStart < 0 || returnClose < returnStart) throw new Error('comparison return object not found')
            const insertionPoint = functionStart + returnClose
            const field = `\n    searchHistory: Object.freeze({\n      policy: searchHistoryPolicy,\n      allComplete: optimized.every(\n        (result) => result.searchHistoryCoverage.status === 'complete',\n      ),\n      producers: Object.freeze(\n        optimized.map((result) => result.searchHistoryCoverage),\n      ),\n    }),`
            compare = `${compare.slice(0, insertionPoint)}${field}${compare.slice(insertionPoint)}`
          }
          fs.writeFileSync(comparePath, compare)

          const indexPath = 'src/campaign/index.ts'
          let index = fs.readFileSync(indexPath, 'utf8')
          if (!index.includes("from './search-history-receipt'")) {
            const anchor = '// ── Durable improvement-search audit log ────────────────────────────\n'
            if (!index.includes(anchor)) throw new Error('campaign export anchor not found')
            index = index.replace(
              anchor,
              `// ── Compact proof over the canonical improvement-search ledger ───────\nexport {\n  assertCompleteSearchHistory,\n  assertSearchHistoryMatchesReplay,\n  type CreateSearchHistoryReceiptInput,\n  createSearchHistoryReceipt,\n  type SearchHistoryCoverage,\n  type SearchHistoryCoverageRow,\n  type SearchHistoryEntityIndex,\n  type SearchHistoryEventIndex,\n  type SearchHistoryPolicy,\n  type SearchHistoryReceipt,\n  SearchHistoryRequiredError,\n  SEARCH_HISTORY_RECEIPT_DIGEST_ALGORITHM,\n  SEARCH_HISTORY_RECEIPT_SCHEMA_VERSION,\n  searchHistoryCoverageRow,\n  verifySearchHistoryReceipt,\n} from './search-history-receipt'\n${anchor}`,
            )
          }
          fs.writeFileSync(indexPath, index)

          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          if (!readme.includes('## Auditable optimization history')) {
            readme += `\n## Auditable optimization history\n\nOptimization methods may return a \`SearchHistoryReceipt\` over Eval's canonical hash-chained \`SearchLedger\`. Existing comparisons remain source-compatible and report missing coverage. Autonomous and publication-grade runs set \`searchHistoryPolicy: 'require-complete'\` to refuse missing candidates, attempts, operations, decisions, or terminal evidence before the untouched test set is opened.\n\nThe receipt is a tamper-evident table of contents, not a second event log. See [Complete search history](docs/search-history-receipts.md) for the ELI5 model, proof limits, ownership boundaries, and integration recipe.\n`
          }
          fs.writeFileSync(readmePath, readme)

          const changelogPath = 'CHANGELOG.md'
          if (fs.existsSync(changelogPath)) {
            let changelog = fs.readFileSync(changelogPath, 'utf8')
            const note = `### Added\n\n- Add \`SearchHistoryReceipt\`, a compact content-addressed index over the canonical \`SearchLedger\`, and expose search-history coverage from \`compareOptimizationMethods\`. \`searchHistoryPolicy: 'require-complete'\` fails before untouched-test scoring when any method omits or incompletely records its planned search denominator. The ledger remains the sole rich event history.\n\n`
            if (!changelog.includes('Add `SearchHistoryReceipt`')) {
              const unreleased = /^# Changelog\n\n## Unreleased\n\n/m
              if (unreleased.test(changelog)) {
                changelog = changelog.replace(unreleased, (match) => `${match}${note}`)
              } else {
                changelog = `# Changelog\n\n## Unreleased\n\n${note}${changelog.replace(/^# Changelog\n\n?/, '')}`
              }
            }
            fs.writeFileSync(changelogPath, changelog)
          }
          EOF

          pnpm biome check --write \
            README.md \
            docs/search-history-receipts.md \
            src/campaign/index.ts \
            src/campaign/search-history-receipt.ts \
            src/campaign/search-history-receipt.test.ts \
            src/campaign/presets/compare-optimization-methods.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts

      - name: Prove the focused behavior
        run: |
          pnpm typecheck
          pnpm test -- \
            src/campaign/search-history-receipt.test.ts \
            src/campaign/presets/compare-optimization-methods-history.test.ts
          pnpm build

      - name: Prove repository-wide compatibility
        run: |
          pnpm lint
          pnpm test

      - name: Commit validated code and remove one-time workflows
        run: |
          rm -f .github/workflows/audit-search-history-receipts.yml
          rm -f .github/workflows/finalize-search-history-receipts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(history): make complete optimizer evidence a first-class contract"
          git push
